# Blueprint de Render: crea el servicio web y la base Postgres de una.
# En Render: New > Blueprint > apuntar a este repo.
services:
  - type: web
    name: galex
    runtime: node
    plan: free
    # Cada push a main dispara un deploy solo (es el default, lo dejamos explicito).
    branch: main
    autoDeploy: true
    # --omit=dev saltea sqlite3, que solo se usa para desarrollo local.
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /salud
    envVars:
      # URL publica: con esto los links de acceso que van por mail salen bien.
      - key: APP_URL
        sync: false
      # SMTP para el envio de la rendicion y los accesos. sync:false = se cargan a mano en el
      # dashboard de Render; sin ellas el envio queda deshabilitado.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: galex-db
          property: connectionString
      # Firma la cookie de sesión. Render genera un valor aleatorio la primera vez;
      # sin esto se usaría el valor por defecto de src/auth.js, que es público.
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: galex-db
    plan: free
    databaseName: galex
